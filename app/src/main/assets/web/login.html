<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン - NNDD-RE TV</title>
<style>
  :root {
    --bg: #121212;
    --surface: #1e1e1e;
    --border: #333;
    --accent: #ff8a3d;
    --text: #eee;
    --subtext: #999;
    --error: #ff5252;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    width: 100%;
    max-width: 400px;
  }
  h1 { font-size: 1.3rem; margin: 0 0 20px; color: var(--accent); text-align: center; }
  label { display: block; margin: 16px 0 6px; font-size: 0.85rem; color: var(--subtext); }
  input {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #2a2a2a;
    color: var(--text);
    font-size: 1rem;
  }
  button {
    width: 100%;
    margin-top: 24px;
    padding: 12px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #121212;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; }
  .error { color: var(--error); margin-top: 12px; font-size: 0.85rem; min-height: 1em; }
  .hint { color: var(--subtext); font-size: 0.8rem; margin-top: 16px; text-align: center; }
</style>
</head>
<body>
  <div class="card">
    <h1 id="title">ニコニコアカウントでログイン</h1>

    <form id="loginForm">
      <label for="mailTel">メールアドレス または 電話番号</label>
      <input type="text" id="mailTel" autocomplete="username" required>
      <label for="password">パスワード</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button type="submit" id="submitBtn">ログイン</button>
      <div class="error" id="errorMsg"></div>
    </form>

    <form id="mfaForm" style="display:none;">
      <p class="hint">確認コードをメールでお送りしました</p>
      <label for="otp">確認コード</label>
      <input type="text" id="otp" inputmode="numeric" autocomplete="one-time-code" required>
      <button type="submit" id="mfaSubmitBtn">確認</button>
      <div class="error" id="mfaErrorMsg"></div>
    </form>

    <div class="hint">TVで見るには同一Wi-Fi内でこのログインを完了してください</div>
  </div>

<script>
let mfaSubmitUrl = null;

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const errorEl = document.getElementById('errorMsg');
  errorEl.textContent = '';
  btn.disabled = true;
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({
        mailTel: document.getElementById('mailTel').value,
        password: document.getElementById('password').value
      })
    });
    const data = await res.json();
    if (data.status === 'ok') {
      window.location.href = '/home.html';
    } else if (data.status === 'mfa_required') {
      mfaSubmitUrl = data.mfaSubmitUrl;
      document.getElementById('title').textContent = '2段階認証';
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('mfaForm').style.display = 'block';
    } else {
      errorEl.textContent = data.message || 'ログインに失敗しました';
    }
  } catch (err) {
    errorEl.textContent = '通信に失敗しました';
  } finally {
    btn.disabled = false;
  }
});

document.getElementById('mfaForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('mfaSubmitBtn');
  const errorEl = document.getElementById('mfaErrorMsg');
  errorEl.textContent = '';
  btn.disabled = true;
  try {
    const res = await fetch('/api/auth/mfa', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'same-origin',
      body: JSON.stringify({
        mfaSubmitUrl: mfaSubmitUrl,
        code: document.getElementById('otp').value
      })
    });
    const data = await res.json();
    if (data.status === 'ok') {
      window.location.href = '/home.html';
    } else {
      errorEl.textContent = data.message || '確認コードが正しくありません';
    }
  } catch (err) {
    errorEl.textContent = '通信に失敗しました';
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
