<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NNDD-REライブラリ - NNDD-RE TV</title>
<style>
  :root {
    --bg: #121212; --surface: #1e1e1e; --border: #333;
    --accent: #ff8a3d; --text: #eee; --subtext: #999;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif; padding: 24px; }
  h1 { font-size: 1.2rem; color: var(--accent); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px; }
  .thumb { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 6px; background: #2a2a2a; margin-bottom: 8px; }
  .title { font-size: 0.85rem; line-height: 1.4; margin-bottom: 8px; height: 3.9em; overflow: hidden; }
  .playBtn { width: 100%; padding: 8px; border-radius: 6px; border: none; background: var(--accent); color: #121212; font-size: 0.85rem; cursor: pointer; }
  .status { color: var(--subtext); margin: 12px 0; }
  a.back { color: var(--subtext); text-decoration: none; font-size: 0.85rem; }
</style>
</head>
<body>
  <a class="back" href="/home.html">&larr; ホームに戻る</a>
  <h1>NNDD-REライブラリ</h1>
  <div class="status" id="status">読み込み中…</div>
  <div class="grid" id="grid"></div>

<script>
async function loadLibrary() {
  const statusEl = document.getElementById('status');
  const gridEl = document.getElementById('grid');
  try {
    const connRes = await fetch('/api/library-connection', { credentials: 'same-origin' });
    const conn = await connRes.json();
    if (!conn.host) {
      statusEl.textContent = '設定画面から接続先を設定してください';
      return;
    }

    const res = await fetch('/api/library', { credentials: 'same-origin' });
    const items = await res.json();
    const playable = items.filter(item => item.videoId);
    if (playable.length === 0) {
      statusEl.textContent = 'ライブラリが空です';
      return;
    }
    statusEl.textContent = '';
    // thumbUrlはローカルファイルパスの場合があるため使わず、必ず共有サーバーのサムネイルエンドポイント経由で取得する
    gridEl.innerHTML = playable.map(item => `
      <div class="card">
        <img class="thumb" src="http://${conn.host}:${conn.port}/api/video/${encodeURIComponent(item.videoId)}/thumb" alt="" loading="lazy">
        <div class="title">${escapeHtml(item.videoName)}</div>
        <button class="playBtn" onclick="playOnTv('${item.videoId}')">TVで再生</button>
      </div>
    `).join('');
  } catch (e) {
    statusEl.textContent = 'ライブラリの取得に失敗しました';
  }
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

async function playOnTv(videoId) {
  await fetch('/api/playback/play-library', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    credentials: 'same-origin',
    body: JSON.stringify({ videoId })
  });
  location.href = '/home.html';
}

loadLibrary();
</script>
<script src="/nav-watcher.js"></script>
</body>
</html>
